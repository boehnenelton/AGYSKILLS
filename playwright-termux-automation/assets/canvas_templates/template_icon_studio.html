<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Studio — Dynamic Icon & Graphic Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #capture-stage {
      position: relative;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes pulseCore {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(222, 38, 38, 0.4)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 16px rgba(222, 38, 38, 0.9)); }
    }
    @keyframes rotateReticle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .anim-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseCore 3s ease-in-out infinite;
    }
    .anim-rotate {
      transform-box: fill-box;
      transform-origin: center;
      animation: rotateReticle 10s linear infinite;
    }
  </style>
</head>
<body>
  <div id="capture-stage">
    <div class="svg-container" id="svg-host">
      <!-- Dynamically generated or parameterized SVG content -->
      <svg id="default-icon" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect x="12" y="12" width="232" height="232" rx="54" fill="#0d0d14" stroke="#252535" stroke-width="2"/>
        <rect x="16" y="16" width="224" height="224" rx="50" fill="none" stroke="#DE2626" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.5"/>
        <g class="anim-rotate">
          <circle cx="128" cy="128" r="80" fill="none" stroke="#1f1f2c" stroke-width="1.5"/>
          <circle cx="128" cy="128" r="80" fill="none" stroke="#DE2626" stroke-width="2" stroke-dasharray="20 60" stroke-linecap="round"/>
        </g>
        <g class="anim-pulse">
          <polygon points="128,84 170,108 128,132 86,108" fill="#FFFFFF" stroke="#DE2626" stroke-width="1.5"/>
          <polygon points="128,132 86,108 86,156 128,180" fill="#242432" stroke="#36364a" stroke-width="1.5"/>
          <polygon points="128,132 170,108 170,156 128,180" fill="#14141c" stroke="#36364a" stroke-width="1.5"/>
          <line x1="128" y1="132" x2="128" y2="180" stroke="#DE2626" stroke-width="2"/>
          <circle cx="128" cy="132" r="3" fill="#DE2626"/>
        </g>
      </svg>
    </div>
  </div>

  <script>
    // URL query parser
    const params = new URLSearchParams(window.location.search);
    const sizeParam = params.get('size') || '256x256';
    const bgParam = params.get('bg') || '#000000';
    const stage = document.getElementById('capture-stage');

    const [w, h] = sizeParam.includes('x') ? sizeParam.split('x').map(Number) : [Number(sizeParam), Number(sizeParam)];
    stage.style.width = (w || 256) + 'px';
    stage.style.height = (h || 256) + 'px';
    stage.style.background = bgParam === 'transparent' ? 'transparent' : bgParam;

    window.isReadyToCapture = false;
    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'paused');
    };
    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'running');
    };
    window.seekProgress = function(progress) {
      const totalDurationSec = 3.0;
      const targetTimeSec = progress * totalDurationSec;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { window.isReadyToCapture = true; }, 250);
    });
  </script>
</body>
</html>
