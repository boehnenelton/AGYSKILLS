<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Icon — 128x128 System Icon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #capture-stage {
      position: relative;
      width: 128px;
      height: 128px;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(222, 38, 38, 0.4));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 10px rgba(222, 38, 38, 0.9));
      }
    }
    .anim-pulse {
      transform-origin: 64px 64px;
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="capture-stage">
    <div class="svg-container">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer Border -->
        <rect x="6" y="6" width="116" height="116" rx="28" fill="#0d0d12" stroke="#252533" stroke-width="2"/>
        <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="#DE2626" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

        <!-- Central Glyph Container -->
        <g class="anim-pulse">
          <!-- Isometric Cube 104 -->
          <!-- Top Face -->
          <polygon points="64,36 88,50 64,64 40,50" fill="#FFFFFF" stroke="#DE2626" stroke-width="1.5"/>
          <!-- Left Face -->
          <polygon points="64,64 40,50 40,78 64,92" fill="#2a2a38" stroke="#3d3d52" stroke-width="1.5"/>
          <!-- Right Face -->
          <polygon points="64,64 88,50 88,78 64,92" fill="#181822" stroke="#3d3d52" stroke-width="1.5"/>
          <!-- Central Spine -->
          <line x1="64" y1="64" x2="64" y2="92" stroke="#DE2626" stroke-width="2"/>
          <circle cx="64" cy="64" r="2.5" fill="#DE2626"/>
        </g>

        <!-- Corner Micro Accents -->
        <circle cx="20" cy="20" r="1.5" fill="#DE2626"/>
        <circle cx="108" cy="20" r="1.5" fill="#DE2626"/>
        <circle cx="20" cy="108" r="1.5" fill="#DE2626"/>
        <circle cx="108" cy="108" r="1.5" fill="#DE2626"/>
      </svg>
    </div>
  </div>

  <script>
    window.isReadyToCapture = false;
    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'paused');
    };
    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'running');
    };
    window.seekProgress = function(progress) {
      const totalDurationSec = 3.0;
      const targetTimeSec = progress * totalDurationSec;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { window.isReadyToCapture = true; }, 250);
    });
  </script>
</body>
</html>
