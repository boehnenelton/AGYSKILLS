<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Graphic — 240x80 Action Button</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }
    #capture-stage {
      position: relative;
      width: 240px;
      height: 80px;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 4px rgba(222, 38, 38, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 12px rgba(222, 38, 38, 0.9));
      }
    }
    @keyframes chevronShift {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }

    .anim-glow {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }
    .anim-arrow {
      animation: chevronShift 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="capture-stage">
    <div class="svg-container">
      <svg viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#14141d"/>
            <stop offset="100%" stop-color="#08080c"/>
          </linearGradient>
        </defs>

        <!-- Button Outer Perimeter with Chamfers -->
        <g class="anim-glow">
          <polygon points="18,8 222,8 232,18 232,62 222,72 18,72 8,62 8,18" fill="url(#btnBg)" stroke="#DE2626" stroke-width="2"/>
        </g>
        <polygon points="21,12 219,12 228,21 228,59 219,68 21,68 12,59 12,21" fill="none" stroke="#252535" stroke-width="1"/>

        <!-- Left Micro-Cube Icon -->
        <g transform="translate(18, 16)">
          <!-- Cube Top -->
          <polygon points="16,10 26,16 16,22 6,16" fill="#FFFFFF" stroke="#DE2626" stroke-width="1"/>
          <!-- Cube Left -->
          <polygon points="16,22 6,16 6,28 16,34" fill="#252533" stroke="#3d3d50" stroke-width="1"/>
          <!-- Cube Right -->
          <polygon points="16,22 26,16 26,28 16,34" fill="#14141c" stroke="#3d3d50" stroke-width="1"/>
          <line x1="16" y1="22" x2="16" y2="34" stroke="#DE2626" stroke-width="1.5"/>
          <circle cx="16" cy="22" r="1.5" fill="#DE2626"/>
        </g>

        <!-- Button Label -->
        <text x="64" y="44" fill="#FFFFFF" font-size="12" font-family="monospace" font-weight="700" letter-spacing="2">INITIALIZE_CORE</text>
        <text x="64" y="58" fill="#777788" font-size="8" font-family="monospace" letter-spacing="1">L5 · DETERMINISTIC</text>

        <!-- Right Chevron Accent -->
        <g class="anim-arrow" transform="translate(208, 34)">
          <path d="M 0 0 L 6 6 L 0 12" fill="none" stroke="#DE2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
  </div>

  <script>
    window.isReadyToCapture = false;
    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'paused');
    };
    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'running');
    };
    window.seekProgress = function(progress) {
      const totalDurationSec = 2.5;
      const targetTimeSec = progress * totalDurationSec;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { window.isReadyToCapture = true; }, 200);
    });
  </script>
</body>
</html>
