<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Icon — 64x64 Small Icon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #capture-stage {
      position: relative;
      width: 64px;
      height: 64px;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes pulsePip {
      0%, 100% { fill: #FFFFFF; filter: drop-shadow(0 0 2px #FFFFFF); }
      50% { fill: #DE2626; filter: drop-shadow(0 0 6px #DE2626); }
    }
    .anim-pip {
      animation: pulsePip 2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="capture-stage">
    <div class="svg-container">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <!-- Rounded Micro Tile -->
        <rect x="3" y="3" width="58" height="58" rx="14" fill="#0d0d12" stroke="#252533" stroke-width="1.5"/>
        <rect x="5" y="5" width="54" height="54" rx="12" fill="none" stroke="#DE2626" stroke-width="0.8" opacity="0.5"/>

        <!-- Pixel-Snapped Isometric Glyph -->
        <!-- Top Face -->
        <polygon points="32,16 46,24 32,32 18,24" fill="#FFFFFF" stroke="#DE2626" stroke-width="1"/>
        <!-- Left Face -->
        <polygon points="32,32 18,24 18,38 32,46" fill="#252530" stroke="#353545" stroke-width="1"/>
        <!-- Right Face -->
        <polygon points="32,32 46,24 46,38 32,46" fill="#14141c" stroke="#353545" stroke-width="1"/>
        <!-- Spine -->
        <line x1="32" y1="32" x2="32" y2="46" stroke="#DE2626" stroke-width="1.2"/>

        <!-- Center Glowing Nucleus -->
        <circle cx="32" cy="32" r="2" class="anim-pip"/>
      </svg>
    </div>
  </div>

  <script>
    window.isReadyToCapture = false;
    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'paused');
    };
    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => el.style.animationPlayState = 'running');
    };
    window.seekProgress = function(progress) {
      const totalDurationSec = 2.0;
      const targetTimeSec = progress * totalDurationSec;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { window.isReadyToCapture = true; }, 200);
    });
  </script>
</body>
</html>
