<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Stage — Universal Dynamic Size Switcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    body.theme-light {
      background: #FFFFFF;
    }
    body.theme-transparent {
      background: transparent !important;
    }
    #capture-stage {
      position: relative;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1c1c24;
    }
    body.theme-light #capture-stage {
      background: #FFFFFF;
      border-color: #E2E2E8;
    }
    body.theme-transparent #capture-stage {
      background: transparent !important;
      border-color: transparent !important;
    }
    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg, img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    /* Fallback default sample SVG animation */
    @keyframes spinWheel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .default-wheel {
      transform-origin: center;
      animation: spinWheel 6s linear infinite;
    }
  </style>
</head>
<body>
  <div id="capture-stage">
    <div class="svg-container" id="svg-slot">
      <!-- Default Fallback Geometric SVG -->
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <circle cx="200" cy="200" r="140" fill="none" stroke="#22222a" stroke-width="2" />
        <g class="default-wheel">
          <circle cx="200" cy="200" r="100" fill="none" stroke="#DE2626" stroke-width="3" stroke-dasharray="16,8" />
          <polygon points="200,80 230,130 170,130" fill="#DE2626" />
        </g>
        <circle cx="200" cy="200" r="30" fill="#181820" stroke="#333340" stroke-width="2" />
        <circle cx="200" cy="200" r="10" fill="#FFFFFF" />
        <text x="200" y="360" fill="#888899" font-size="12" font-family="monospace" letter-spacing="2" text-anchor="middle">UNIVERSAL_STAGE</text>
      </svg>
    </div>
  </div>

  <script>
    window.isReadyToCapture = false;

    // Parse URL parameters
    const queryParams = new URLSearchParams(window.location.search);
    const sizeParam = queryParams.get('size') || '800x800';
    const bgParam = queryParams.get('bg') || 'dark';
    const svgParam = queryParams.get('svg');

    // Apply dimensions
    const [targetWidth, targetHeight] = sizeParam.toLowerCase().split('x').map(val => parseInt(val, 10));
    const stageElement = document.getElementById('capture-stage');

    if (!isNaN(targetWidth) && !isNaN(targetHeight)) {
      stageElement.style.width = `${targetWidth}px`;
      stageElement.style.height = `${targetHeight}px`;
      stageElement.setAttribute('data-width', targetWidth);
      stageElement.setAttribute('data-height', targetHeight);
    } else {
      stageElement.style.width = '800px';
      stageElement.style.height = '800px';
    }

    // Apply theme
    if (bgParam === 'light') {
      document.body.classList.add('theme-light');
    } else if (bgParam === 'transparent') {
      document.body.classList.add('theme-transparent');
    }

    // Load external SVG if specified
    if (svgParam) {
      fetch(svgParam)
        .then(res => res.text())
        .then(svgText => {
          document.getElementById('svg-slot').innerHTML = svgText;
          window.isReadyToCapture = true;
        })
        .catch(err => {
          console.error("Failed to load custom SVG:", err);
          window.isReadyToCapture = true;
        });
    } else {
      window.isReadyToCapture = true;
    }

    // Playwright animation hooks
    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'paused';
      });
    };

    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'running';
      });
    };

    window.seekProgress = function(progress, durationSeconds = 6.0) {
      const targetTimeSec = progress * durationSeconds;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };
  </script>
</body>
</html>
