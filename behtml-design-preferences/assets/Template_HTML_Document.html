<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-height: 100dvh;
            --ry-unit: 32px;
            --bg-canvas: #ffffff;
            --text-primary: #000000;
            --color-accent: #DE2626;
            --color-muted-gray: #71717a;
            --color-disabled-gray: #a1a1aa;
            --color-disabled-bg: #f4f4f5;
            --border-canvas: 1px solid transparent;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Viewport lock: window never scrolls, inner document canvas handles overflow */
        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 15px;
            line-height: 1.6;
            width: 100vw;
            height: var(--app-height);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 16-sublane grid: Sublane 1 (0.5 cell: 6.25%), Sublanes 2..15 (7 cells: 87.5%), Sublane 16 (0.5 cell: 6.25%) */
        .behtml-stage {
            display: grid;
            grid-template-columns: 6.25% repeat(14, 6.25%) 6.25%;
            grid-auto-rows: var(--ry-unit);
            width: 100vw;
            height: var(--app-height);
            background-color: var(--bg-canvas);
        }

        /* Row 1: Full-width Title Bar with bottom accent */
        .behtml-title-bar {
            grid-column: 1 / -1;
            grid-row: 1 / span 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-bottom: 2px solid var(--color-accent);
            background-color: var(--bg-canvas);
            z-index: 20;
        }

        .behtml-title-bar h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        .behtml-title-bar h1 span {
            color: var(--color-accent);
        }

        /* Canvas: 17 rows (Rows 2..18 = 544px) - Completely transparent bottom border */
        /* Must be display: block to maintain document flow and prevent flex-shrink squashing */
        .behtml-doc-canvas {
            grid-column: 2 / 16;
            grid-row: 2 / span 17;
            height: calc(17 * var(--ry-unit));
            max-height: calc(17 * var(--ry-unit));
            display: block;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 24px 20px;
            background-color: var(--bg-canvas);
            border: none;
            border-bottom: 1px solid transparent;
        }

        .behtml-doc-canvas > * {
            flex-shrink: 0;
        }

        /* 0.5-Cell Side Boundaries: Completely transparent and seamless */
        .behtml-edge-gutter {
            background-color: var(--bg-canvas);
            pointer-events: none;
        }

        .gutter-left {
            grid-column: 1 / 2;
            grid-row: 2 / span 17;
            border-right: 1px solid transparent;
        }

        .gutter-right {
            grid-column: 16 / -1;
            grid-row: 2 / span 17;
            border-left: 1px solid transparent;
        }

        .behtml-doc-canvas::-webkit-scrollbar {
            width: 4px;
        }
        .behtml-doc-canvas::-webkit-scrollbar-track {
            background: transparent;
        }
        .behtml-doc-canvas::-webkit-scrollbar-thumb {
            background: var(--color-disabled-gray);
        }
        .behtml-doc-canvas::-webkit-scrollbar-thumb:hover {
            background: var(--color-accent);
        }

        /* Section Heading & Sub-Heading Metadata Block */
        .behtml-doc-canvas h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 1.25rem;
            margin-bottom: 0.25rem;
            border-left: 3px solid var(--color-accent);
            padding-left: 0.75rem;
            line-height: 1.2;
        }

        .behtml-doc-canvas h2:first-of-type {
            margin-top: 0;
        }

        .section-meta-bar {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 1rem;
            padding-left: 0.75rem;
            border-left: 3px solid transparent;
            display: flex;
            gap: 12px;
        }

        .section-meta-bar span {
            color: var(--color-accent);
            font-weight: 700;
        }

        .section-meta-bar em {
            color: var(--color-muted-gray);
            font-style: italic;
        }

        .behtml-doc-canvas p {
            margin-bottom: 1.25rem;
            color: var(--text-primary);
            text-align: justify;
        }

        strong, b {
            font-weight: 700;
            color: var(--color-accent);
        }

        em, i {
            font-style: italic;
            color: var(--color-muted-gray);
        }

        /* Data Table Styling */
        .data-table-wrapper {
            margin: 1.25rem 0 1.75rem;
            overflow-x: auto;
            border: 1px solid var(--text-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.82rem;
        }

        th {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-weight: 700;
            text-align: left;
            padding: 8px 12px;
            border-bottom: 2px solid var(--color-accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #e4e4e7;
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            font-weight: 700;
            color: var(--color-accent);
        }

        .status-badge-disabled {
            font-size: 0.75rem;
            padding: 2px 6px;
            background-color: var(--color-disabled-bg);
            color: var(--color-disabled-gray);
            border: 1px solid var(--color-disabled-gray);
            text-transform: uppercase;
        }

        /* Monospace Pre & Text Box Blocks: Smashed Text Box Prevention */
        code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            color: var(--color-accent);
            font-weight: 500;
        }

        pre, textarea, .text-box {
            display: block;
            width: 100%;
            min-height: calc(3 * var(--ry-unit));
            line-height: 1.5;
            background-color: var(--bg-canvas);
            border: 1px solid var(--text-primary);
            border-left: 4px solid var(--color-accent);
            padding: 1rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-primary);
            box-sizing: border-box;
        }

        pre code {
            color: var(--text-primary);
            font-size: 0.85rem;
            white-space: pre;
            line-height: 1.5;
        }

        textarea {
            resize: vertical;
            min-height: calc(4 * var(--ry-unit));
            outline: none;
        }

        textarea:focus {
            border-color: var(--color-accent);
        }

        /* Action Controls */
        .control-row {
            display: flex;
            gap: 12px;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid var(--color-accent);
            background-color: var(--color-accent);
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            background-color: var(--text-primary);
            border-color: var(--text-primary);
        }

        button:disabled {
            background-color: var(--color-disabled-bg);
            border-color: var(--color-disabled-gray);
            color: var(--color-disabled-gray);
            cursor: not-allowed;
        }

        /* Monospace Author Footer Bar */
        .author-null-footer {
            margin-top: 2rem;
            padding-top: 14px;
            border-top: 1px solid var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            flex-wrap: wrap;
            gap: 8px;
        }

        .author-null-footer .auth-field {
            font-weight: 700;
            color: var(--color-accent);
        }

        .author-null-footer .null-token {
            color: var(--color-muted-gray);
            font-style: italic;
        }

        /* Widgets Shelf: Shifted to Row 20 (Height 5 rows = 160px) */
        .behtml-widget-shelf {
            grid-column: 2 / 16;
            grid-row: 20 / span 5;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 0 16px;
            background-color: var(--bg-canvas);
        }

        /* 150x150 Widget Blocks: Completely transparent seamless borders */
        .widget-block {
            width: 150px;
            min-width: 150px;
            max-width: 150px;
            height: 150px;
            min-height: 150px;
            max-height: 150px;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            background-color: var(--bg-canvas);
            flex-shrink: 0;
        }

        .widget-block-header {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            border-bottom: 2px solid var(--color-accent);
            padding-bottom: 4px;
        }

        .widget-block-body {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--color-muted-gray);
            font-style: italic;
            text-align: center;
        }

        .widget-block-footer {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 700;
            color: var(--color-accent);
            text-transform: uppercase;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="behtml-stage">
        <!-- Row 1: Full-Width Seamless Title Bar with Red Bottom Line -->
        <header class="behtml-title-bar">
            <h1><span>//</span> DOCUMENT TITLE</h1>
        </header>

        <!-- 0.5-Cell Side Boundaries: Completely transparent -->
        <div class="behtml-edge-gutter gutter-left"></div>
        <div class="behtml-edge-gutter gutter-right"></div>

        <!-- Canvas: 17 Rows = 544px, Completely transparent borders -->
        <main class="behtml-doc-canvas">
            <h2>Section Heading</h2>
            <div class="section-meta-bar">
                <div>DATE: <span>YYYY-MM-DD</span></div>
                <div>AUTHOR: <span>Author</span></div>
                <div>STATUS: <em>Draft</em></div>
            </div>

            <p></p>

            <footer class="author-null-footer">
                <div>AUTHOR: <span class="auth-field">Elton Boehnen</span> &lt;boehnenelton2024@gmail.com&gt;</div>
                <div class="null-token">REVISION: // UNSET</div>
            </footer>
        </main>

        <!-- Widgets Shelf: Centered, Transparent Outer Box Borders -->
        <section class="behtml-widget-shelf">
            <div class="widget-block">
                <div class="widget-block-header">Widget 01</div>
                <div class="widget-block-body"><em>150x150 Slot</em></div>
                <div class="widget-block-footer">Active</div>
            </div>
            <div class="widget-block">
                <div class="widget-block-header">Widget 02</div>
                <div class="widget-block-body"><em>150x150 Slot</em></div>
                <div class="widget-block-footer">Active</div>
            </div>
        </section>
    </div>

    <script>
        if (window.visualViewport) {
            const syncCanvasHeight = () => {
                document.documentElement.style.setProperty(
                    '--app-height',
                    `${window.visualViewport.height}px`
                );
            };
            window.visualViewport.addEventListener('resize', syncCanvasHeight);
            syncCanvasHeight();
        }
    </script>
</body>
</html>
