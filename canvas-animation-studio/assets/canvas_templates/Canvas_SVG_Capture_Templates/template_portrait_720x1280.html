<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Stage — Portrait 720x1280 (9:16)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #capture-stage {
      position: relative;
      width: 720px;
      height: 1280px;
      background: #09090c;
      border: 1px solid #1c1c22;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .svg-container {
      width: 100%;
      height: 100%;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    @keyframes dropPulse {
      0% {
        transform: translateY(0);
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(600px);
        opacity: 0.1;
      }
    }
    .anim-drop {
      animation: dropPulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
</head>
<body>
  <div id="capture-stage" data-width="720" data-height="1280" data-ratio="9:16">
    <div class="svg-container">
      <svg id="svg-root" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="verticalBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0a0a0f" />
            <stop offset="50%" stop-color="#050507" />
            <stop offset="100%" stop-color="#020203" />
          </linearGradient>
          <linearGradient id="redPillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#DE2626" stop-opacity="1" />
            <stop offset="100%" stop-color="#DE2626" stop-opacity="0" />
          </linearGradient>
        </defs>

        <rect width="720" height="1280" fill="url(#verticalBg)" />

        <!-- Header HUD Area -->
        <g transform="translate(48, 64)">
          <rect x="0" y="0" width="140" height="28" rx="4" fill="#181820" stroke="#282834" stroke-width="1" />
          <circle cx="14" cy="14" r="4" fill="#DE2626" />
          <text x="28" y="18" fill="#888899" font-size="11" font-family="monospace">PORTRAIT REEL</text>

          <text x="0" y="64" fill="#FFFFFF" font-size="28" font-family="sans-serif" font-weight="900" letter-spacing="1">TELEMETRY STACK</text>
          <text x="0" y="90" fill="#DE2626" font-size="13" font-family="monospace">DIMENSIONS: 720x1280 (9:16)</text>
        </g>

        <!-- Vertical Guide Lines -->
        <line x1="360" y1="200" x2="360" y2="1140" stroke="#1c1c24" stroke-width="2" />
        <line x1="180" y1="200" x2="180" y2="1140" stroke="#14141a" stroke-width="1" stroke-dasharray="6,6" />
        <line x1="540" y1="200" x2="540" y2="1140" stroke="#14141a" stroke-width="1" stroke-dasharray="6,6" />

        <!-- Falling Data Pulse Signal -->
        <g class="anim-drop" transform="translate(360, 240)">
          <line x1="0" y1="-80" x2="0" y2="0" stroke="url(#redPillarGrad)" stroke-width="3" />
          <circle cx="0" cy="0" r="6" fill="#DE2626" />
        </g>

        <!-- Stacked Card Blocks (6 Tiers) -->
        <g transform="translate(180, 260)">
          <!-- Tier 6 -->
          <rect x="0" y="0" width="360" height="110" rx="10" fill="#141418" stroke="#2c2c38" stroke-width="1.5" />
          <text x="24" y="44" fill="#FFFFFF" font-size="16" font-weight="700">L6 Composition</text>
          <text x="24" y="74" fill="#777788" font-size="12" font-family="monospace">DAG Execution Root</text>
          <circle cx="320" cy="55" r="12" fill="#1e1e26" />
          <text x="320" y="59" fill="#DE2626" font-size="11" font-weight="700" text-anchor="middle">6</text>

          <!-- Tier 4 -->
          <rect x="0" y="150" width="360" height="110" rx="10" fill="#141418" stroke="#2c2c38" stroke-width="1.5" />
          <text x="24" y="194" fill="#FFFFFF" font-size="16" font-weight="700">L4 Presentation</text>
          <text x="24" y="224" fill="#777788" font-size="12" font-family="monospace">BEHTML Spatial Grids</text>
          <circle cx="320" cy="205" r="12" fill="#1e1e26" />
          <text x="320" y="209" fill="#DE2626" font-size="11" font-weight="700" text-anchor="middle">4</text>

          <!-- Tier 2 -->
          <rect x="0" y="300" width="360" height="110" rx="10" fill="#141418" stroke="#2c2c38" stroke-width="1.5" />
          <text x="24" y="344" fill="#FFFFFF" font-size="16" font-weight="700">L2 Verification</text>
          <text x="24" y="374" fill="#777788" font-size="12" font-family="monospace">Stage-Gate Validators</text>
          <circle cx="320" cy="355" r="12" fill="#1e1e26" />
          <text x="320" y="359" fill="#DE2626" font-size="11" font-weight="700" text-anchor="middle">2</text>

          <!-- Tier 1 Core Anchor -->
          <rect x="0" y="450" width="360" height="130" rx="10" fill="#181822" stroke="#DE2626" stroke-width="2" />
          <polygon points="24,484 34,492 24,500" fill="#DE2626" />
          <text x="44" y="496" fill="#FFFFFF" font-size="18" font-weight="900">L1 Substrate</text>
          <text x="24" y="534" fill="#AAAAAA" font-size="12" font-family="monospace">BEJSON Tabular Discipline</text>
          <circle cx="320" cy="515" r="14" fill="#DE2626" />
          <text x="320" y="520" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">1</text>
        </g>

        <!-- Footer -->
        <text x="360" y="1220" fill="#555566" font-size="12" font-family="monospace" letter-spacing="2" text-anchor="middle">PLAYWRIGHT_PORTRAIT_CAPTURE</text>
      </svg>
    </div>
  </div>

  <script>
    window.isReadyToCapture = false;

    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'paused';
      });
    };

    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'running';
      });
    };

    window.seekProgress = function(progress) {
      const totalDurationSec = 3.5;
      const targetTimeSec = progress * totalDurationSec;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        window.isReadyToCapture = true;
      }, 300);
    });
  </script>
</body>
</html>
