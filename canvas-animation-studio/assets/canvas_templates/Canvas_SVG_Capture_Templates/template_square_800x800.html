<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Stage — Square 800x800 (1:1)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    /* Fixed-size capture stage */
    #capture-stage {
      position: relative;
      width: 800px;
      height: 800px;
      background: #000000;
      border: 1px solid #1c1c22;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Embedded SVG container */
    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Animated element keyframes */
    @keyframes pulseCore {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(222, 38, 38, 0.4));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 24px rgba(222, 38, 38, 0.9));
      }
    }
    @keyframes orbitRing {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .anim-pulse {
      transform-origin: 400px 400px;
      animation: pulseCore 3s ease-in-out infinite;
    }
    .anim-orbit {
      transform-origin: 400px 400px;
      animation: orbitRing 8s linear infinite;
    }
  </style>
</head>
<body>
  <div id="capture-stage" data-width="800" data-height="800" data-ratio="1:1">
    <div class="svg-container">
      <svg id="svg-root" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1e0a0a" stop-opacity="0.8" />
            <stop offset="60%" stop-color="#0a0a0d" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF4D4D" />
            <stop offset="60%" stop-color="#DE2626" />
            <stop offset="100%" stop-color="#800A0A" />
          </linearGradient>
          <linearGradient id="isoTop" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2c2c34" />
            <stop offset="100%" stop-color="#444450" />
          </linearGradient>
          <linearGradient id="isoLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#18181e" />
            <stop offset="100%" stop-color="#101014" />
          </linearGradient>
          <linearGradient id="isoRight" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#121216" />
            <stop offset="100%" stop-color="#08080a" />
          </linearGradient>
        </defs>

        <!-- Background Ambient Glow -->
        <rect width="800" height="800" fill="url(#stageGlow)" />

        <!-- Outer Reticle & Scale Marks -->
        <circle cx="400" cy="400" r="340" fill="none" stroke="#222228" stroke-width="1.5" stroke-dasharray="8,6" />
        <circle cx="400" cy="400" r="280" fill="none" stroke="#18181f" stroke-width="1" />

        <!-- Rotating Orbit Nodes (L6) -->
        <g class="anim-orbit">
          <circle cx="400" cy="60" r="6" fill="#DE2626" />
          <line x1="400" y1="60" x2="400" y2="85" stroke="#DE2626" stroke-width="1.5" />
          <circle cx="740" cy="400" r="4" fill="#FFFFFF" opacity="0.8" />
          <circle cx="400" cy="740" r="4" fill="#FFFFFF" opacity="0.8" />
          <circle cx="60" cy="400" r="4" fill="#FFFFFF" opacity="0.8" />
        </g>

        <!-- Center Isometric Cube Cluster (Core L1-L3) -->
        <g class="anim-pulse">
          <!-- Base Platform -->
          <polygon points="400,280 520,350 400,420 280,350" fill="url(#isoTop)" stroke="#555562" stroke-width="1.5" />
          <polygon points="280,350 400,420 400,560 280,490" fill="url(#isoLeft)" stroke="#383844" stroke-width="1.5" />
          <polygon points="400,420 520,350 520,490 400,560" fill="url(#isoRight)" stroke="#22222a" stroke-width="1.5" />

          <!-- Floating Core Red Cube -->
          <g transform="translate(0, -60)">
            <polygon points="400,310 460,345 400,380 340,345" fill="url(#redAccentGrad)" stroke="#FFAAAA" stroke-width="1.5" />
            <polygon points="340,345 400,380 400,450 340,415" fill="#CC1F1F" stroke="#991414" stroke-width="1.5" />
            <polygon points="400,380 460,345 460,415 400,450" fill="#880D0D" stroke="#660A0A" stroke-width="1.5" />
          </g>
        </g>

        <!-- Coordinate Geometry HUD Overlay -->
        <text x="40" y="70" fill="#888899" font-size="12" font-family="monospace" letter-spacing="2">CANVAS_DIM: 800x800</text>
        <text x="40" y="90" fill="#DE2626" font-size="11" font-family="monospace" letter-spacing="1">RATIO: 1:1 SQUARE</text>
        <text x="760" y="70" fill="#555566" font-size="11" font-family="monospace" text-anchor="end">FPS: 60 SYNC</text>
        <text x="400" y="740" fill="#777788" font-size="13" font-family="sans-serif" font-weight="700" letter-spacing="4" text-anchor="middle">ANIMATION STAGE</text>
      </svg>
    </div>
  </div>

  <script>
    // Playwright deterministic capture hooks
    window.isReadyToCapture = false;

    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'paused';
      });
    };

    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'running';
      });
    };

    window.seekProgress = function(progress) {
      // Seek CSS animation progression [0.0 to 1.0]
      const totalDurationSec = 8.0;
      const targetTimeSec = progress * totalDurationSec;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };

    window.addEventListener('DOMContentLoaded', () => {
      // Allow fonts and SVG layout to settle
      setTimeout(() => {
        window.isReadyToCapture = true;
      }, 300);
    });
  </script>
</body>
</html>
