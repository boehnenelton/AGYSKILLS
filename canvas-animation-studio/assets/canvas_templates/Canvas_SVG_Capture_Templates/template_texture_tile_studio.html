<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seamless Texture Tile Studio & Playwright Capture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    /* Fixed-size capture stage for tiled canvas */
    #capture-stage {
      position: relative;
      width: 800px;
      height: 800px;
      background: #000000;
      border: 1px solid #1c1c22;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Standalone tile unit container */
    #tile-unit {
      position: absolute;
      top: -9999px;
      left: -9999px;
      background: #000000;
      overflow: hidden;
    }

    /* In mode=tile, tile-unit replaces stage view */
    body.mode-tile #capture-stage {
      display: none;
    }
    body.mode-tile #tile-unit {
      position: relative;
      top: 0;
      left: 0;
      border: 1px solid #DE2626;
      box-shadow: 0 0 20px rgba(222, 38, 38, 0.4);
    }

    svg.canvas-fill {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Animations */
    @keyframes patternDrift {
      0% {
        transform: translate(0px, 0px);
      }
      100% {
        transform: translate(var(--tile-size, 64px), var(--tile-size, 64px));
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        opacity: 0.35;
        filter: drop-shadow(0 0 2px #DE2626);
      }
      50% {
        opacity: 1.0;
        filter: drop-shadow(0 0 8px #DE2626);
      }
    }

    .anim-drift {
      animation: patternDrift 6s linear infinite;
    }

    .anim-pulse {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    /* Compact studio toolbar */
    #studio-bar {
      position: fixed;
      top: 12px;
      display: flex;
      gap: 8px;
      background: rgba(10, 10, 14, 0.9);
      padding: 6px 12px;
      border: 1px solid #22222a;
      border-radius: 4px;
      font-size: 11px;
      z-index: 100;
    }
    #studio-bar.hidden {
      display: none;
    }
    .bar-btn {
      background: #181820;
      color: #FFFFFF;
      border: 1px solid #33333f;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .bar-btn:hover, .bar-btn.active {
      background: #DE2626;
      border-color: #DE2626;
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <!-- Controls bar (hidden if ?ui=hide) -->
  <div id="studio-bar">
    <button class="bar-btn active" onclick="setPattern('cube')">Cube</button>
    <button class="bar-btn" onclick="setPattern('checkerboard')">Checkerboard</button>
    <button class="bar-btn" onclick="setPattern('circuit')">Circuit</button>
    <button class="bar-btn" onclick="setPattern('hex')">Hex Mesh</button>
    <button class="bar-btn" onclick="setPattern('dots')">Dots</button>
    <button class="bar-btn" onclick="toggleMode()">Toggle Tile/Canvas</button>
  </div>

  <!-- Full Tiled Canvas Stage -->
  <div id="capture-stage">
    <svg class="canvas-fill" xmlns="http://www.w3.org/2000/svg">
      <defs id="svg-defs">
        <!-- Injected dynamically via JS to support all patterns & tile sizes -->
      </defs>

      <!-- Fill entire canvas with active pattern -->
      <rect id="canvas-rect" width="100%" height="100%" fill="url(#studio-pattern)"/>

      <!-- Ambient Vignette -->
      <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
        <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
      </radialGradient>
      <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>
    </svg>
  </div>

  <!-- Isolated Tile Unit -->
  <div id="tile-unit">
    <svg id="tile-svg" xmlns="http://www.w3.org/2000/svg">
      <!-- Injected dynamically via JS -->
    </svg>
  </div>

  <script>
    window.isReadyToCapture = false;

    // Pattern definitions dictionary
    const PATTERN_REGISTRY = {
      cube: (size) => `
        <pattern id="studio-pattern" width="${size}" height="${size}" patternUnits="userSpaceOnUse" class="anim-drift">
          <rect width="${size}" height="${size}" fill="#050508"/>
          <!-- Top Face -->
          <polygon points="${size*0.5},${size*0.28} ${size*0.75},${size*0.4} ${size*0.5},${size*0.53} ${size*0.25},${size*0.4}" fill="#181820" stroke="#2c2c36" stroke-width="1"/>
          <!-- Left Face -->
          <polygon points="${size*0.25},${size*0.4} ${size*0.5},${size*0.53} ${size*0.5},${size*0.78} ${size*0.25},${size*0.65}" fill="#0d0d12" stroke="#2c2c36" stroke-width="1"/>
          <!-- Right Face -->
          <polygon points="${size*0.5},${size*0.53} ${size*0.75},${size*0.4} ${size*0.75},${size*0.65} ${size*0.5},${size*0.78}" fill="#13131a" stroke="#2c2c36" stroke-width="1"/>
          <!-- Accent floating outline (104a) -->
          <polygon points="${size*0.5},${size*0.22} ${size*0.68},${size*0.31} ${size*0.5},${size*0.4} ${size*0.32},${size*0.31}" fill="none" stroke="#DE2626" stroke-width="1.2" opacity="0.85"/>
          <circle cx="${size*0.5}" cy="${size*0.53}" r="2" fill="#DE2626" class="anim-pulse"/>
        </pattern>
      `,
      checkerboard: (size) => `
        <pattern id="studio-pattern" width="${size}" height="${size}" patternUnits="userSpaceOnUse" class="anim-drift">
          <rect x="0" y="0" width="${size*0.5}" height="${size*0.5}" fill="#000000"/>
          <rect x="${size*0.5}" y="0" width="${size*0.5}" height="${size*0.5}" fill="#111116"/>
          <rect x="0" y="${size*0.5}" width="${size*0.5}" height="${size*0.5}" fill="#111116"/>
          <rect x="${size*0.5}" y="${size*0.5}" width="${size*0.5}" height="${size*0.5}" fill="#000000"/>
          <path d="M 0,0 L ${size},0 L ${size},${size} L 0,${size} Z" fill="none" stroke="#1c1c24" stroke-width="1"/>
          <path d="M ${size*0.5},0 L ${size*0.5},${size} M 0,${size*0.5} L ${size},${size*0.5}" stroke="#22222c" stroke-width="0.75"/>
          <circle cx="${size*0.5}" cy="${size*0.5}" r="3" fill="none" stroke="#DE2626" stroke-width="1" class="anim-pulse"/>
        </pattern>
      `,
      circuit: (size) => `
        <pattern id="studio-pattern" width="${size}" height="${size}" patternUnits="userSpaceOnUse" class="anim-drift">
          <rect width="${size}" height="${size}" fill="#040407"/>
          <line x1="0" y1="${size*0.5}" x2="${size*0.3}" y2="${size*0.5}" stroke="#22222a" stroke-width="1.5"/>
          <line x1="${size*0.7}" y1="${size*0.5}" x2="${size}" y2="${size*0.5}" stroke="#22222a" stroke-width="1.5"/>
          <line x1="${size*0.5}" y1="0" x2="${size*0.5}" y2="${size*0.3}" stroke="#22222a" stroke-width="1.5"/>
          <line x1="${size*0.5}" y1="${size*0.7}" x2="${size*0.5}" y2="${size}" stroke="#22222a" stroke-width="1.5"/>
          <line x1="0" y1="${size*0.75}" x2="${size}" y2="${size*0.75}" stroke="#DE2626" stroke-width="1" class="anim-pulse"/>
          <circle cx="${size*0.5}" cy="${size*0.5}" r="${size*0.08}" fill="#0a0a0f" stroke="#33333f" stroke-width="1"/>
          <circle cx="${size*0.5}" cy="${size*0.5}" r="${size*0.04}" fill="#DE2626" class="anim-pulse"/>
        </pattern>
      `,
      hex: (size) => `
        <pattern id="studio-pattern" width="${size}" height="${size*0.866}" patternUnits="userSpaceOnUse" class="anim-drift">
          <rect width="${size}" height="${size*0.866}" fill="#020204"/>
          <polygon points="${size*0.5},0 ${size},${size*0.288} ${size},${size*0.577} ${size*0.5},${size*0.866} 0,${size*0.577} 0,${size*0.288}" fill="none" stroke="#161622" stroke-width="1"/>
          <circle cx="${size*0.5}" cy="${size*0.433}" r="2" fill="#DE2626" class="anim-pulse"/>
        </pattern>
      `,
      dots: (size) => `
        <pattern id="studio-pattern" width="${size*0.25}" height="${size*0.25}" patternUnits="userSpaceOnUse" class="anim-drift">
          <rect width="${size*0.25}" height="${size*0.25}" fill="#000000"/>
          <circle cx="${size*0.125}" cy="${size*0.125}" r="1.5" fill="#33333f"/>
          <circle cx="${size*0.125}" cy="${size*0.125}" r="0.8" fill="#DE2626" class="anim-pulse"/>
        </pattern>
      `
    };

    let activePatternKey = 'cube';
    let currentTileSize = 64;
    let isTileOnlyMode = false;

    function applyPattern() {
      document.documentElement.style.setProperty('--tile-size', `${currentTileSize}px`);
      const generator = PATTERN_REGISTRY[activePatternKey] || PATTERN_REGISTRY.cube;
      document.getElementById('svg-defs').innerHTML = generator(currentTileSize);

      // Also render isolated tile unit SVG
      const tileSvg = document.getElementById('tile-svg');
      tileSvg.setAttribute('width', currentTileSize);
      tileSvg.setAttribute('height', currentTileSize);
      tileSvg.setAttribute('viewBox', `0 0 ${currentTileSize} ${currentTileSize}`);
      tileSvg.innerHTML = generator(currentTileSize).replace(/id="studio-pattern"[^>]*>/, '').replace('</pattern>', '');
    }

    function setPattern(key) {
      activePatternKey = key;
      document.querySelectorAll('.bar-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase().includes(key));
      });
      applyPattern();
    }

    function toggleMode() {
      isTileOnlyMode = !isTileOnlyMode;
      document.body.classList.toggle('mode-tile', isTileOnlyMode);
    }

    // Playwright hooks
    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'paused';
      });
    };

    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'running';
      });
    };

    window.seekProgress = function(progress) {
      const totalDurationSec = 6.0;
      const targetTimeSec = progress * totalDurationSec;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };

    // Parse URL parameters
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('pattern')) {
        activePatternKey = urlParams.get('pattern');
      }
      if (urlParams.has('tilesize')) {
        currentTileSize = parseInt(urlParams.get('tilesize'), 10) || 64;
      }
      if (urlParams.has('mode') && urlParams.get('mode') === 'tile') {
        isTileOnlyMode = true;
        document.body.classList.add('mode-tile');
      }
      if (urlParams.has('ui') && urlParams.get('ui') === 'hide') {
        document.getElementById('studio-bar').classList.add('hidden');
      }
      if (urlParams.has('canvas')) {
        const [w, h] = urlParams.get('canvas').split('x').map(n => parseInt(n, 10));
        if (w && h) {
          const stage = document.getElementById('capture-stage');
          stage.style.width = `${w}px`;
          stage.style.height = `${h}px`;
        }
      }

      applyPattern();

      setTimeout(() => {
        window.isReadyToCapture = true;
      }, 300);
    });
  </script>
</body>
</html>
