<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seamless Texture Tile Stage — Checkerboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    /* Fixed 840x420 Banner Stage */
    #capture-stage {
      position: relative;
      width: 840px;
      height: 420px;
      background: #000000;
      border: 1px solid #1c1c22;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Isolated single tile container for direct seamless tile unit capture */
    #tile-unit {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 64px;
      height: 64px;
      background: #000000;
      overflow: hidden;
    }

    svg.canvas-fill {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Seamless scroll animation */
    @keyframes checkerDrift {
      0% {
        transform: translate(0px, 0px);
      }
      100% {
        transform: translate(64px, 64px);
      }
    }

    /* Subtle pulse animation for accent borders */
    @keyframes accentGlow {
      0%, 100% {
        opacity: 0.35;
        stroke: #DE2626;
      }
      50% {
        opacity: 0.95;
        stroke: #FFFFFF;
      }
    }

    .anim-drift {
      animation: checkerDrift 4s linear infinite;
    }

    .anim-glow {
      animation: accentGlow 2.5s ease-in-out infinite;
    }

    .telemetry-tag {
      position: absolute;
      bottom: 12px;
      left: 16px;
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.8);
      padding: 3px 6px;
      border: 1px solid #1c1c22;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Full Tiled Canvas Stage (840x420) -->
  <div id="capture-stage">
    <svg class="canvas-fill" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Seamless 64x64 Checkerboard Pattern -->
        <pattern id="checker-pattern" width="64" height="64" patternUnits="userSpaceOnUse" class="anim-drift">
          <!-- Quadrant 1 (Top-Left: 32x32) -->
          <rect x="0" y="0" width="32" height="32" fill="#000000"/>
          <line x1="0" y1="0" x2="32" y2="32" stroke="#16161c" stroke-width="0.5"/>
          <line x1="32" y1="0" x2="0" y2="32" stroke="#16161c" stroke-width="0.5"/>
          <circle cx="16" cy="16" r="1.5" fill="#DE2626" opacity="0.6"/>

          <!-- Quadrant 2 (Top-Right: 32x32) -->
          <rect x="32" y="0" width="32" height="32" fill="#111116"/>
          <rect x="36" y="4" width="24" height="24" fill="none" stroke="#22222a" stroke-width="1"/>
          <circle cx="48" cy="16" r="1" fill="#FFFFFF" opacity="0.4"/>

          <!-- Quadrant 3 (Bottom-Left: 32x32) -->
          <rect x="0" y="32" width="32" height="32" fill="#111116"/>
          <rect x="4" y="36" width="24" height="24" fill="none" stroke="#22222a" stroke-width="1"/>
          <circle cx="16" cy="48" r="1" fill="#FFFFFF" opacity="0.4"/>

          <!-- Quadrant 4 (Bottom-Right: 32x32) -->
          <rect x="32" y="32" width="32" height="32" fill="#000000"/>
          <line x1="32" y1="32" x2="64" y2="64" stroke="#16161c" stroke-width="0.5"/>
          <line x1="64" y1="32" x2="32" y2="64" stroke="#16161c" stroke-width="0.5"/>
          <circle cx="48" cy="48" r="1.5" fill="#DE2626" opacity="0.6"/>

          <!-- Seamless Grid Boundary & Accent Crosshair -->
          <path d="M 0,0 L 64,0 L 64,64 L 0,64 Z" fill="none" stroke="#1c1c24" stroke-width="1"/>
          <path d="M 32,0 L 32,64 M 0,32 L 64,32" stroke="#22222c" stroke-width="0.75"/>
          <!-- Active Center Reticle -->
          <circle cx="32" cy="32" r="3" fill="none" stroke="#DE2626" stroke-width="1" class="anim-glow"/>
        </pattern>
      </defs>

      <!-- Fill entire canvas with seamless pattern -->
      <rect width="100%" height="100%" fill="url(#checker-pattern)"/>

      <!-- Ambient Vignette -->
      <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
        <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
      </radialGradient>
      <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>
    </svg>

    <div class="telemetry-tag">TEXTURE_TILE // CHECKERBOARD_64PX</div>
  </div>

  <!-- Single 64x64 Tile Unit -->
  <div id="tile-unit">
    <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="32" height="32" fill="#000000"/>
      <rect x="32" y="0" width="32" height="32" fill="#111116"/>
      <rect x="0" y="32" width="32" height="32" fill="#111116"/>
      <rect x="32" y="32" width="32" height="32" fill="#000000"/>
      <path d="M 0,0 L 64,0 L 64,64 L 0,64 Z" fill="none" stroke="#1c1c24" stroke-width="1"/>
      <path d="M 32,0 L 32,64 M 0,32 L 64,32" stroke="#22222c" stroke-width="0.75"/>
      <circle cx="32" cy="32" r="3" fill="none" stroke="#DE2626" stroke-width="1"/>
      <circle cx="16" cy="16" r="1.5" fill="#DE2626"/>
      <circle cx="48" cy="48" r="1.5" fill="#DE2626"/>
    </svg>
  </div>

  <script>
    window.isReadyToCapture = false;

    window.pauseAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'paused';
      });
    };

    window.playAnimation = function() {
      document.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'running';
      });
    };

    window.seekProgress = function(progress) {
      const totalDurationSec = 4.0;
      const targetTimeSec = progress * totalDurationSec;
      document.querySelectorAll('*').forEach(el => {
        el.style.animationDelay = `-${targetTimeSec}s`;
        el.style.animationPlayState = 'paused';
      });
    };

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        window.isReadyToCapture = true;
      }, 300);
    });
  </script>
</body>
</html>
