<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>BEHTML Feed Stream // Card & News Stream Archetype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           BEHTML Feed Template (Card, News, Blog, & Activity Stream Archetype)
           Author: Elton Boehnen · boehnenelton2024@gmail.com
           Standards: Policy 8.1 Tri-Color (#000000, #FFFFFF, #DE2626)
                      Header: 64px (2 * Ry=32px)
                      Modular Stream Cards (8-Lane & 16-Wide Alignment)
                      Feed Tag Filtering System
                      Anti-Drift Auditor HUD
           ========================================================================== */
        :root {
            --app-height: 100dvh;
            --ry-unit: 32px;
            --bg-page: #000000;
            --bg-card: #0d0d0d;
            --bg-surface: #FFFFFF;
            --text-light: #FFFFFF;
            --text-dark: #000000;
            --color-accent: #DE2626;
            --color-accent-hover: #b91c1c;
            --border-subtle: 1px solid #222222;
            --border-strong: 1px solid #333333;
            --color-muted: #888888;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-light);
            font-family: var(--font-ui);
            overflow: hidden;
            width: 100vw;
            height: var(--app-height);
            -webkit-font-smoothing: antialiased;
        }

        /* Contained Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-accent); }

        /* Top Docked Control Hub */
        .feed-header {
            height: 64px;
            background-color: var(--bg-page);
            border-bottom: 2px solid var(--color-accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top, 0px) + 8px) 24px 8px 24px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .feed-brand {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
        }

        .feed-badge {
            background-color: var(--color-accent);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            letter-spacing: 1.2px;
        }

        .feed-filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .filter-pill {
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 4px 10px;
            background: #161616;
            color: #aaaaaa;
            border: 1px solid #333333;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-pill:hover,
        .filter-pill.active {
            background: var(--color-accent);
            color: #FFFFFF;
            border-color: var(--color-accent);
        }

        /* Feed Layout Stream */
        .feed-stream-container {
            margin-top: 64px;
            height: calc(100% - 64px);
            overflow-y: auto;
            padding: 24px 24px 60px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .feed-meta-summary {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222222;
            padding-bottom: 10px;
        }

        /* 8-Lane / 16-Wide Responsive Grid for Cards */
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        /* Modular Feed Card */
        .feed-card {
            background-color: var(--bg-card);
            border: var(--border-subtle);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .feed-card:hover {
            border-color: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(222, 38, 38, 0.2);
        }

        .feed-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .feed-card-author {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .author-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--color-accent);
        }

        .feed-card-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.35;
            color: #FFFFFF;
            margin-bottom: 10px;
            letter-spacing: -0.01em;
        }

        .feed-card-description {
            font-size: 13.5px;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 16px;
            text-align: justify;
        }

        .feed-tag-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .feed-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 2px 8px;
            background: #1c1c1c;
            color: #aaaaaa;
            border: 1px solid #2e2e2e;
            text-transform: uppercase;
        }

        .feed-card-footer {
            border-top: 1px solid #1c1c1c;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .feed-card-action {
            color: var(--color-accent);
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }

        .feed-card-action:hover {
            color: #FFFFFF;
        }

        /* Stream Trigger & Pagination */
        .feed-load-container {
            margin-top: 32px;
            display: flex;
            justify-content: center;
        }

        button.feed-load-btn {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            padding: 10px 24px;
            background: transparent;
            color: var(--color-accent);
            border: 1px solid var(--color-accent);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        button.feed-load-btn:hover {
            background: var(--color-accent);
            color: #FFFFFF;
        }

        /* Anti-Drift Auditor HUD */
        .behtml-auditor-hud {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--color-accent);
            padding: 8px 14px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: #FFFFFF;
            letter-spacing: 1px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        .behtml-auditor-hud__status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        @media (max-width: 768px) {
            .feed-header {
                padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px 16px;
            }
            .feed-brand {
                font-size: 12px;
            }
            .feed-stream-container {
                padding: 16px 16px 60px;
            }
            .feed-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Top Control Bar (64px = 2 * 32px) -->
    <header class="feed-header">
        <div class="feed-brand">
            <span>Brand</span>
            <span class="feed-badge">Badge</span>
        </div>
        <div class="feed-filter-bar">
            <button class="filter-pill active" type="button" onclick="filterFeed('all')">Filter All</button>
            <button class="filter-pill" type="button" onclick="filterFeed('category1')">Filter 1</button>
            <button class="filter-pill" type="button" onclick="filterFeed('category2')">Filter 2</button>
        </div>
    </header>

    <!-- Main Scrollable Stream Container -->
    <main class="feed-stream-container">
        <div class="feed-meta-summary">
            <span>STREAM: Stream Header</span>
            <span>COUNT: Count Placeholder</span>
        </div>

        <div class="feed-grid" id="feedGrid">
            <!-- Feed Card 1 -->
            <article class="feed-card" data-category="category1">
                <div>
                    <div class="feed-card-header">
                        <span class="feed-card-author"><span class="author-dot"></span> Author 1</span>
                        <span>Date 1</span>
                    </div>
                    <h2 class="feed-card-title">Card Title 1</h2>
                    <p class="feed-card-description">Content Body</p>
                    <div class="feed-tag-row">
                        <span class="feed-tag">Tag 1</span>
                        <span class="feed-tag">Tag 2</span>
                    </div>
                </div>
                <div class="feed-card-footer">
                    <span>ID: ID Placeholder 1</span>
                    <a class="feed-card-action">Action 1 &rarr;</a>
                </div>
            </article>

            <!-- Feed Card 2 -->
            <article class="feed-card" data-category="category2">
                <div>
                    <div class="feed-card-header">
                        <span class="feed-card-author"><span class="author-dot"></span> Author 2</span>
                        <span>Date 2</span>
                    </div>
                    <h2 class="feed-card-title">Card Title 2</h2>
                    <p class="feed-card-description">Content Body</p>
                    <div class="feed-tag-row">
                        <span class="feed-tag">Tag 1</span>
                        <span class="feed-tag">Tag 2</span>
                    </div>
                </div>
                <div class="feed-card-footer">
                    <span>ID: ID Placeholder 2</span>
                    <a class="feed-card-action">Action 2 &rarr;</a>
                </div>
            </article>
        </div>

        <div class="feed-load-container">
            <button class="feed-load-btn" type="button" onclick="loadMore()">Action (Load More)</button>
        </div>
    </main>

    <!-- Anti-Drift Auditor HUD -->
    <div class="behtml-auditor-hud">
        <span class="behtml-auditor-hud__status-dot"></span>
        <span>FEED AUDITOR: SYNCED (DELTA: 0.00px)</span>
    </div>

    <script>
        function filterFeed(category) {
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const cards = document.querySelectorAll('.feed-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function loadMore() {
            alert("BEHTML Feed: Additional dispatches loaded from stream.");
        }

        function syncFeedHeight() {
            if (window.visualViewport) {
                document.documentElement.style.setProperty('--app-height', `${window.visualViewport.height}px`);
            }
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncFeedHeight);
        }
        syncFeedHeight();
    </script>
</body>
</html>
