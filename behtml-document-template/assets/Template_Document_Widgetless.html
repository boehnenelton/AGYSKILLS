<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
    <title>Document // Widgetless</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           BEHTML Canonical Web Document Template (Widgetless Variant)
           Author: Elton Boehnen · boehnenelton2024@gmail.com
           Standards: Policy 8.1 Tri-Color (#FFFFFF, #000000, #DE2626)
                      16-Sublane Horizontal Partitioning (6.25% gutters, 87.5% canvas)
                      Ry = 32px Vertical Quantization
                      Full-Height Canvas (No Widget Shelf)
           ========================================================================== */
        :root {
            --app-height: 100dvh;
            --ry-unit: 32px;
            --bg-canvas: #ffffff;
            --text-primary: #000000;
            --color-accent: #DE2626;
            --color-muted-gray: #71717a;
            --color-disabled-gray: #a1a1aa;
            --color-disabled-bg: #f4f4f5;
            --border-canvas: 1px solid transparent;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Viewport Lock: Window never scrolls; inner canvas handles scroll isolation */
        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 15px;
            line-height: 1.6;
            width: 100vw;
            height: var(--app-height);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Contained Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-disabled-gray); }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-accent); }

        /* 16-Sublane Stage:
           Sublane 1: 6.25% left gutter
           Sublanes 2..15: 14 sublanes = 87.5% document canvas
           Sublane 16: 6.25% right gutter
           Vertical Rows: Row 1 = 32px Title Bar, Rows 2..24 = Full remaining canvas */
        .behtml-stage {
            display: grid;
            grid-template-columns: 6.25% repeat(14, 6.25%) 6.25%;
            grid-template-rows: var(--ry-unit) 1fr;
            width: 100vw;
            height: var(--app-height);
            background-color: var(--bg-canvas);
        }

        /* Row 1: Full-width Title Bar with bottom accent */
        .behtml-title-bar {
            grid-column: 1 / -1;
            grid-row: 1 / span 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-bottom: 2px solid var(--color-accent);
            background-color: var(--bg-canvas);
            z-index: 20;
        }

        .behtml-title-bar h1 {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .behtml-title-bar h1 span {
            color: var(--color-accent);
        }

        /* Seamless Edge Gutters */
        .behtml-edge-gutter {
            background-color: var(--bg-canvas);
            pointer-events: none;
        }

        .gutter-left {
            grid-column: 1 / 2;
            grid-row: 2 / -1;
            border-right: 1px solid transparent;
        }

        .gutter-right {
            grid-column: 16 / -1;
            grid-row: 2 / -1;
            border-left: 1px solid transparent;
        }

        /* Document Canvas: Full height (no widget shelf), display: block prevents flex squashing */
        .behtml-doc-canvas {
            grid-column: 2 / 16;
            grid-row: 2 / -1;
            height: calc(var(--app-height) - var(--ry-unit));
            max-height: calc(var(--app-height) - var(--ry-unit));
            display: block;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 32px 48px;
            background-color: var(--bg-canvas);
            border: none;
        }

        .behtml-doc-canvas > * {
            flex-shrink: 0;
        }

        /* Section Typography */
        .behtml-doc-canvas h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 1.5rem;
            margin-bottom: 0.25rem;
            border-left: 3px solid var(--color-accent);
            padding-left: 0.75rem;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .behtml-doc-canvas h2:first-of-type {
            margin-top: 0;
        }

        .section-meta-bar {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            padding-left: 0.75rem;
            border-left: 3px solid transparent;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .section-meta-bar span {
            color: var(--color-accent);
            font-weight: 700;
        }

        .section-meta-bar em {
            color: var(--color-muted-gray);
            font-style: italic;
        }

        .behtml-doc-canvas p {
            margin-bottom: 1.25rem;
            color: var(--text-primary);
            text-align: justify;
        }

        strong, b {
            font-weight: 700;
            color: var(--color-accent);
        }

        em, i {
            font-style: italic;
            color: var(--color-muted-gray);
        }

        /* Data Tables */
        .data-table-wrapper {
            margin: 1.25rem 0 1.75rem;
            overflow-x: auto;
            border: 1px solid var(--text-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 0.82rem;
        }

        th {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-weight: 700;
            text-align: left;
            padding: 8px 12px;
            border-bottom: 2px solid var(--color-accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #e4e4e7;
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            font-weight: 700;
            color: var(--color-accent);
        }

        /* Monospace Pre & Text Box Blocks: Smashed Text Box Prevention */
        code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            color: var(--color-accent);
            font-weight: 500;
        }

        pre, textarea, .text-box {
            display: block;
            width: 100%;
            min-height: calc(3 * var(--ry-unit));
            line-height: 1.5;
            background-color: var(--bg-canvas);
            border: 1px solid var(--text-primary);
            border-left: 4px solid var(--color-accent);
            padding: 1rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-primary);
            box-sizing: border-box;
        }

        pre code {
            color: var(--text-primary);
            font-size: 0.85rem;
            white-space: pre;
            line-height: 1.5;
        }

        textarea {
            resize: vertical;
            min-height: calc(4 * var(--ry-unit));
            outline: none;
        }

        textarea:focus {
            border-color: var(--color-accent);
        }

        /* Action Buttons */
        .control-row {
            display: flex;
            gap: 12px;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid var(--color-accent);
            background-color: var(--color-accent);
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            background-color: var(--text-primary);
            border-color: var(--text-primary);
        }

        button:disabled {
            background-color: var(--color-disabled-bg);
            border-color: var(--color-disabled-gray);
            color: var(--color-disabled-gray);
            cursor: not-allowed;
        }

        /* Monospace Author Footer */
        .author-null-footer {
            margin-top: 2.5rem;
            padding-top: 14px;
            border-top: 1px solid var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            flex-wrap: wrap;
            gap: 8px;
        }

        .author-null-footer .auth-field {
            font-weight: 700;
            color: var(--color-accent);
        }

        .author-null-footer .null-token {
            font-style: italic;
            color: var(--color-muted-gray);
        }

        @media (max-width: 768px) {
            .behtml-stage {
                grid-template-columns: 0px 1fr 0px;
            }
            .gutter-left, .gutter-right { display: none; }
            .behtml-doc-canvas {
                grid-column: 2 / 3;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="behtml-stage">
        <!-- Row 1: Full-Width Title Bar -->
        <header class="behtml-title-bar">
            <h1><span>//</span> DOCUMENT TITLE // WIDGETLESS</h1>
        </header>

        <!-- Sublane 1: Left Gutter (6.25%) -->
        <div class="behtml-edge-gutter gutter-left"></div>

        <!-- Sublanes 2..15: Full-Height Document Canvas (87.5%) -->
        <main class="behtml-doc-canvas">
            <h2>Section Heading</h2>
            <div class="section-meta-bar">
                <span>DATE: YYYY-MM-DD</span>
                <em>AUTHOR: Author</em>
                <span>STATUS: Draft</span>
                <em>VARIANT: Widgetless</em>
            </div>

            <p></p>

            <!-- Author Footer -->
            <footer class="author-null-footer">
                <div><span class="auth-field">AUTHOR:</span> Elton Boehnen &lt;boehnenelton2024@gmail.com&gt;</div>
                <div><span class="null-token">REVISION: // UNSET</span></div>
            </footer>
        </main>

        <!-- Sublane 16: Right Gutter (6.25%) -->
        <div class="behtml-edge-gutter gutter-right"></div>
    </div>

    <script>
        function syncCanvasHeight() {
            if (window.visualViewport) {
                document.documentElement.style.setProperty('--app-height', `${window.visualViewport.height}px`);
            }
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncCanvasHeight);
            window.visualViewport.addEventListener('scroll', syncCanvasHeight);
        }
        syncCanvasHeight();
    </script>
</body>
</html>
