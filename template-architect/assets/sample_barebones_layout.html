<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Title</title>
<style>
  :root {
    --bg: #FFFFFF;
    --fg: #000000;
    --accent: #DE2626;
    --border: #000000;
  }
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header.scaffold-header {
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    font-weight: 700;
  }
  .scaffold-body {
    display: flex;
    flex: 1;
  }
  aside.scaffold-sidebar {
    width: 240px;
    border-right: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  main.scaffold-main {
    flex: 1;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  footer.scaffold-footer {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    font-size: 0.85rem;
  }
  .scaffold-sidebar-header {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #666666;
    margin-bottom: 4px;
  }
  .scaffold-tab-bar {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .scaffold-tab-btn {
    background: transparent;
    border: 1px solid var(--border);
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 3px;
    color: var(--fg);
  }
  .scaffold-tab-btn.is-active {
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
  }
  .scaffold-tab-panel {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .scaffold-tab-panel.is-active {
    display: flex;
  }
  .scaffold-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
</style>
</head>
<body>
  <header class="scaffold-header">App Header</header>
  <div class="scaffold-body">
    <aside class="scaffold-sidebar">
      <div class="scaffold-sidebar-header">Navigation Group 1</div>
      <div class="scaffold-box">Sidebar link1</div>
      <div class="scaffold-box">Sidebar link2</div>
      <div class="scaffold-sidebar-header" style="margin-top: 12px;">Navigation Group 2</div>
      <div class="scaffold-box">Sidebar link3</div>
      <div class="scaffold-box">Sidebar link4</div>
    </aside>
    <main class="scaffold-main">
      <h1>Page Title</h1>
      
      <!-- Feature Tabs to prevent wall of text -->
      <nav class="scaffold-tab-bar" role="tablist">
        <button type="button" class="scaffold-tab-btn is-active" role="tab" aria-selected="true" data-tab="tab1">Feature Tab 1</button>
        <button type="button" class="scaffold-tab-btn" role="tab" aria-selected="false" data-tab="tab2">Feature Tab 2</button>
        <button type="button" class="scaffold-tab-btn" role="tab" aria-selected="false" data-tab="tab3">Feature Tab 3</button>
      </nav>

      <!-- Tab Panel 1 -->
      <section id="tab1" class="scaffold-tab-panel is-active" role="tabpanel">
        <div class="scaffold-card-grid">
          <div class="scaffold-box">Card Title 1<br><small>Content Description</small></div>
          <div class="scaffold-box">Card Title 2<br><small>Content Description</small></div>
        </div>
      </section>

      <!-- Tab Panel 2 -->
      <section id="tab2" class="scaffold-tab-panel" role="tabpanel">
        <div class="scaffold-box">Parameter Settings Panel</div>
      </section>

      <!-- Tab Panel 3 -->
      <section id="tab3" class="scaffold-tab-panel" role="tabpanel">
        <div class="scaffold-box">Operational Telemetry View</div>
      </section>
    </main>
  </div>
  <footer class="scaffold-footer">footer_text</footer>

  <script>
    document.querySelectorAll('.scaffold-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.scaffold-tab-btn').forEach(b => {
          b.classList.remove('is-active');
          b.setAttribute('aria-selected', 'false');
        });
        document.querySelectorAll('.scaffold-tab-panel').forEach(p => p.classList.remove('is-active'));
        btn.classList.add('is-active');
        btn.setAttribute('aria-selected', 'true');
        const targetId = btn.getAttribute('data-tab');
        const panel = document.getElementById(targetId);
        if (panel) panel.classList.add('is-active');
      });
    });
  </script>
</body>
</html>
